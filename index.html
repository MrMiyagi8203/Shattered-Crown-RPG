const CH=[['arrive','Arrival at Cinderwatch','Ash falls like slow snow as the gates of Cinderwatch close behind you. Beneath the town lies the Sunken Vault, where Kaelen Ashmoor bound the Hollow Tide with his own body. The seal is failing, and the Crown that anchored it lies shattered across the frontier. Three shards. Three warlords. One chance.',()=>1,{xp:10}],
['first','First Blood','Your first kill leaves a taste of ash in your mouth. Whatever stalks the frontier, it is not only the Tide: the warlords have twisted its gift into hunger.',()=>W.vic>=1,{g:15}],
['tide','The Hollow Tide','Five foes fallen, and a pattern: each bore a dark shimmer beneath the skin. Veteran guards call it the Hollow Tide, a hunger that leaks wherever the seal thins.',()=>W.vic>=5,{xp:40}],

['lv5','A Name Spoken in Ash','Travelers speak your name at their fires. The Crown Guard sends word of welcome, while the Veiled Guild watches to see whom you will serve.',()=>P.lv>=5,{f:['Crown Guard',1],xp:30}],

['vault','Beneath the Crown','The Sunken Vault opens before you, its runed halls older than Cinderwatch. Every echo is a man’s voice, counting down.',()=>(W.rg|0)>=3,{xp:60}],
['end','The Choice','The third shard rings against the others. The realm waits on your decision, and so does the man in the vault.',()=>!!W.end,{xp:100}],
['reaver','The Reavers’ Banner','The Ash Reavers carry banners stitched from Crown Guard cloaks. Someone taught them to shatter armour, and to remember where it was forged.',()=>(P.bs||[]).includes('Ash Reaver'),{g:30,xp:30}],
['hound','Cinder Hounds','The hounds are not wild. Their collars bear the Crown Guard crest, left by a kennel that did not survive the first night of the breach.',()=>(P.bs||[]).includes('Cinder Hound'),{g:20}],
['warden','Wardens of the Wood','The barkbound wardens were pilgrims who sought the forest’s protection. It gave it, and kept them.',()=>(P.bs||[]).includes('Barkbound Warden'),{xp:40}],
['hag','What the Hag Remembers','Among the hag’s herbs you find a map of the Hollow Wood with Kaelen’s road drawn in red. At its edge she wrote only: “He asked to be forgotten.”',()=>(P.bs||[]).includes('Moss Hag'),{xp:50}],
['lurker','Things in the Black Water','The lurkers were drowned travelers, remade by the marsh. They mend as the water mends: patiently, and without mercy.',()=>(P.bs||[]).includes('Mire Lurker'),{xp:50}],
['sexton','The Sexton’s Bell','Each toll of the drowned bell marks a name, and each name belongs to someone the Tide has taken. You count nine. The tenth will be yours if you let it.',()=>(P.bs||[]).includes('Bell-Drowned Sexton'),{xp:70,m:4}],
['runew','The Vault Keepers','The Rune Wardens were built to hold the vault shut against the Tide. No one told them the Tide was already inside.',()=>(P.bs||[]).includes('Rune Warden'),{xp:80}],
['choir','The Choir Below','The Hollow Choir sings in Kaelen’s cadence, a hymn he must have hummed while he held the Tide. It is the saddest sound you have ever heard, and it knows your name.',()=>(P.bs||[]).includes('Hollow Choir'),{xp:100,p:35}]],
RU=['A guard mutters that Kaelen never lost a fight. He chose to stop fighting, which is different.','Marsh-walkers say the dead count aloud when the Tide is near. They always count down.','The Veiled Guild trades in secrets, and they pay well for the names of warlords.','A tinker swears the shards were never one crown. They were keystones, hidden apart on purpose.','Old smiths say Ember Cores hold a fragment of the Crown’s fire, and a blade fed with them never dulls.','Someone carved a message in the tavern wall: “If you free him, you free the Tide as well.”'],
